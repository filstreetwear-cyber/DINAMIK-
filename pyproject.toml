[project]
name = "dinamik-amazon-intelligence"
version = "0.1.0"
description = "Dinamik Advisor Amazon Intelligence Platform — Agent 01: Amazon Scout"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.4",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
dinamik = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions/*.py is generated fresh by Alembic's own
# script.py.mako template on every `alembic revision`, using Union[...]
# instead of X | Y — not worth hand-fixing on every migration. env.py IS
# hand-maintained (see its DATABASE_URL/model-import edits) and stays
# linted normally.
extend-exclude = ["migrations/versions"]
