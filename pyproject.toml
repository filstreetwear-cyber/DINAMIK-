[project]
name = "dinamik-amazon-intelligence"
version = "0.1.0"
description = "Dinamik Advisor Amazon Intelligence Platform — Agent 01: Amazon Scout"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.4",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.45",
    "amzpy>=1.0",  # AmzPyAdapter (app/tools/amazon_scraping) - stesso trattamento di playwright: core, non extra
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[project.scripts]
dinamik = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Milestone 14: celery ships no py.typed marker and there is no
# maintained `types-celery` stub package on PyPI (checked: `pip index
# versions types-celery` finds nothing) -- unlike yaml, where
# types-PyYAML exists and is already a dev dependency. This is the
# documented mypy escape hatch for exactly that situation, scoped to
# celery only, not a blanket ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions/*.py is generated fresh by Alembic's own
# script.py.mako template on every `alembic revision`, using Union[...]
# instead of X | Y — not worth hand-fixing on every migration. env.py IS
# hand-maintained (see its DATABASE_URL/model-import edits) and stays
# linted normally.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
# Milestone 13: FastAPI's own dependency-injection pattern is exactly the
# `Depends(get_session)`-as-default-argument shape B008 exists to catch in
# the general case -- here it's correct by design (FastAPI calls it once
# per request, not once at definition time, unlike a real mutable-default
# bug). ruff's documented fix is this allowlist, not a per-line noqa on
# every endpoint (https://docs.astral.sh/ruff/rules/function-call-in-default-argument/).
extend-immutable-calls = ["fastapi.Depends", "app.database.session.get_session"]
